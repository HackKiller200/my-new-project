# ============================================================
# Loki — SingleBinary + PVC 1 Ti через default StorageClass
# Upstream chart: loki 6.46.0
#
# ВНИМАНИЕ: следующие поля IMMUTABLE после первого деплоя —
# их нельзя менять без ручного удаления StatefulSet:
#   singleBinary.persistence.enabled
#   singleBinary.persistence.size
#   singleBinary.persistence.storageClass
# ============================================================

loki:
  enabled: true
  fullnameOverride: loki
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false

    image:
      # Замените на ваш реальный registry или на docker.io
      registry: docker.io
      repository: grafana/loki
      tag: "3.5.7"
      pullPolicy: IfNotPresent

    commonConfig:
      path_prefix: /var/loki
      replication_factor: 1

    # Обход бага upstream-чарта 6.45+:
    # требуется bucketNames, даже когда type=filesystem.
    # Значения фиктивные, в работе не используются.
    storage:
      type: filesystem
      bucketNames:
        chunks: "fake-bucket-local-fs"
        ruler:  "fake-bucket-local-fs"
        admin:  "fake-bucket-local-fs"
      filesystem:
        chunks_directory: /var/loki/chunks
        rules_directory:  /var/loki/rules

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

  singleBinary:
    replicas: 1

    persistence:
      enabled: true
      size: 1Ti
      storageClass: null
      enableStatefulSetAutoDeletePVC: false
      whenDeleted: Retain
      whenScaled:  Retain

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

  service:
    enabled: true
    type: ClusterIP
    port: 3100

  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  minio:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  test:
    enabled: false
  rollout_operator:
    enabled: false
  enterprise:
    enabled: false
  monitoring:
    serviceMonitor:
      enabled: false
