fluent-bit:
  enabled: true
  kind: DaemonSet
  nameOverride: fluent-bit
  fullnameOverride: fluent-bit


  image:
    repository: .../fluent/fluent-bit
    tag: "5.1.1"
    pullPolicy: IfNotPresent


  serviceAccount:
    create: true
    name: fluent-bit
    automountServiceAccountToken: true

  rbac:
    create: true

  hostNetwork: true

  nodeSelector: {}
  affinity: {}


  tolerations:
    - operator: Exists

  securityContext: {}
  podSecurityContext: {}

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: ClusterIP
    port: 2020

  serviceMonitor:
    enabled: false
  testFramework:
    enabled: false

  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /api/v2/health
      port: http

  config:
    service: |
      [SERVICE]
          Daemon        Off
          Flush         1
          Log_Level     info

          Parsers_File  /fluent-bit/etc/parsers.conf
          Parsers_File  /fluent-bit/etc/conf/custom_parsers.conf

          HTTP_Server   On
          HTTP_Listen   0.0.0.0
          HTTP_Port     2020
          Health_Check  On

    inputs: |
      [INPUT]
          Name              tail
          Path              /var/log/containers/*.log
          Tag               kube.*
          multiline.parser  docker, cri
          Path_Key          source_file
          Refresh_Interval  5
          Mem_Buf_Limit     20MB
          Skip_Long_Lines   On

    filters: ""

    outputs: |
      [OUTPUT]
          Name         udp
          Match        kube.*
          Host         ...
          Port         ...
          Format       json
          Retry_Limit  3

  logLevel: info
